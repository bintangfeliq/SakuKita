<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">
<body>
    <th:block th:fragment="sidebar(halamanAktif)">
        <div class="bar-mobile-atas">
            <a th:href="@{/dashboard}" class="tautan-brand-mobile">
                <img th:src="@{/images/logo1.png}" alt="SakuKita" class="logo-mobile" />
            </a>
            <div class="d-flex align-items-center gap-2">
                <a th:href="@{/logout}" class="btn-logout-mobile" title="Keluar dari Akun" aria-label="Logout">
                    <i class="bx bx-log-out"></i>
                </a>
            </div>
        </div>

        <aside class="sidebar-kapsul" id="sidebarKapsul">
            <div>
                <div class="area-brand-kapsul">
                    <a th:href="@{/dashboard}" class="tautan-brand-kapsul" id="tautanBrand" aria-label="Kecilkan Menu" title="Kecilkan Menu">
                        <div class="logo-card-sidebar">
                            <img th:src="@{/images/logoutama.png}" alt="SakuKita" class="logo-kapsul-panjang" id="logoPanjang" />
                            <img th:src="@{/images/logo1.png}" alt="SakuKita" class="logo-kapsul-kecil" />
                        </div>
                    </a>
                    <button type="button" class="tombol-toggle-kapsul" id="tombolToggleSidebar" aria-label="Kecilkan Menu" title="Kecilkan Menu">
                        <i class="bx bx-chevrons-left" id="ikonToggleSidebar"></i>
                    </button>
                </div>

                <ul class="navigasi-kapsul">
                    <li>
                        <a th:href="@{/dashboard}" class="tautan-menu-kapsul" th:classappend="${halamanAktif == 'dashboard'} ? 'menu-kapsul-aktif' : ''" title="Dashboard">
                            <span class="ikon-menu-kapsul"><i class="bx bx-home-circle"></i></span>
                            <span class="teks-menu-kapsul">Dashboard</span>
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/pemasukan}" class="tautan-menu-kapsul" th:classappend="${halamanAktif == 'pemasukan'} ? 'menu-kapsul-aktif' : ''" title="Pemasukan">
                            <span class="ikon-menu-kapsul"><i class="bx bx-up-arrow-alt"></i></span>
                            <span class="teks-menu-kapsul">Pemasukan</span>
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/pengeluaran}" class="tautan-menu-kapsul" th:classappend="${halamanAktif == 'pengeluaran'} ? 'menu-kapsul-aktif' : ''" title="Pengeluaran">
                            <span class="ikon-menu-kapsul"><i class="bx bx-down-arrow-alt"></i></span>
                            <span class="teks-menu-kapsul">Pengeluaran</span>
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/kategori}" class="tautan-menu-kapsul" th:classappend="${halamanAktif == 'kategori'} ? 'menu-kapsul-aktif' : ''" title="Kategori">
                            <span class="ikon-menu-kapsul"><i class="bx bx-grid-alt"></i></span>
                            <span class="teks-menu-kapsul">Kategori</span>
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/templateTransaksi}" class="tautan-menu-kapsul" th:classappend="${halamanAktif == 'templateTransaksi'} ? 'menu-kapsul-aktif' : ''" title="Template Transaksi">
                            <span class="ikon-menu-kapsul"><i class="bx bx-bookmark"></i></span>
                            <span class="teks-menu-kapsul">Template</span>
                        </a>
                    </li>
                    <li>
                        <a th:href="@{/laporan}" class="tautan-menu-kapsul" th:classappend="${halamanAktif == 'laporan'} ? 'menu-kapsul-aktif' : ''" title="Laporan">
                            <span class="ikon-menu-kapsul"><i class="bx bx-bar-chart-alt-2"></i></span>
                            <span class="teks-menu-kapsul">Laporan</span>
                        </a>
                    </li>
                </ul>
            </div>
        </aside>

        <nav class="nav-bawah-mobile" aria-label="Navigasi Bawah Mobile">
            <a th:href="@{/pemasukan}" class="item-nav-bawah" th:classappend="${halamanAktif == 'pemasukan'} ? 'item-nav-bawah-aktif' : ''">
                <div class="wadah-ikon-nav-bawah">
                    <i class="bx bx-trending-up"></i>
                </div>
                <span class="label-nav-bawah">Masuk</span>
            </a>
            <a th:href="@{/pengeluaran}" class="item-nav-bawah" th:classappend="${halamanAktif == 'pengeluaran'} ? 'item-nav-bawah-aktif' : ''">
                <div class="wadah-ikon-nav-bawah">
                    <i class="bx bx-trending-down"></i>
                </div>
                <span class="label-nav-bawah">Keluar</span>
            </a>
            <a th:href="@{/dashboard}" class="item-nav-bawah" th:classappend="${halamanAktif == 'dashboard'} ? 'item-nav-bawah-aktif' : ''">
                <div class="wadah-ikon-nav-bawah">
                    <i class="bx bx-home-circle"></i>
                </div>
                <span class="label-nav-bawah">Beranda</span>
            </a>
            <a th:href="@{/kategori}" class="item-nav-bawah" th:classappend="${halamanAktif == 'kategori'} ? 'item-nav-bawah-aktif' : ''">
                <div class="wadah-ikon-nav-bawah">
                    <i class="bx bx-grid-alt"></i>
                </div>
                <span class="label-nav-bawah">Kategori</span>
            </a>
            <a th:href="@{/laporan}" class="item-nav-bawah" th:classappend="${halamanAktif == 'laporan'} ? 'item-nav-bawah-aktif' : ''">
                <div class="wadah-ikon-nav-bawah">
                    <i class="bx bx-bar-chart-alt-2"></i>
                </div>
                <span class="label-nav-bawah">Laporan</span>
            </a>
        </nav>

        <script>
            (function () {
                const sidebar = document.getElementById('sidebarKapsul');
                const tombolToggle = document.getElementById('tombolToggleSidebar');
                const tautanBrand = document.getElementById('tautanBrand');
                const ikonToggle = document.getElementById('ikonToggleSidebar');
                const teksMenu = document.querySelectorAll('.teks-menu-kapsul');
                let isCollapsed = false;

                function kecilkanSidebarDesktop() {
                    isCollapsed = true;
                    if (sidebar) sidebar.classList.add('sidebar-kapsul-ringkas');
                    teksMenu.forEach(el => el.style.display = 'none');
                    if (tombolToggle) tombolToggle.setAttribute('title', 'Buka Menu');
                    if (ikonToggle) {
                        ikonToggle.classList.remove('bx-chevrons-left');
                        ikonToggle.classList.add('bx-chevrons-right');
                    }
                }

                function lebarkanSidebarDesktop() {
                    isCollapsed = false;
                    if (sidebar) sidebar.classList.remove('sidebar-kapsul-ringkas');
                    teksMenu.forEach(el => el.style.display = 'inline');
                    if (tombolToggle) tombolToggle.setAttribute('title', 'Kecilkan Menu');
                    if (ikonToggle) {
                        ikonToggle.classList.remove('bx-chevrons-right');
                        ikonToggle.classList.add('bx-chevrons-left');
                    }
                }

                if (tautanBrand) {
                    tautanBrand.addEventListener('click', function (e) {
                        if (window.innerWidth >= 992) {
                            e.preventDefault();
                            kecilkanSidebarDesktop();
                        }
                    });
                }

                if (tombolToggle && !tombolToggle.dataset.toggleInitialized) {
                    tombolToggle.dataset.toggleInitialized = 'true';
                    tombolToggle.addEventListener('click', function () {
                        if (window.innerWidth >= 992) {
                            if (isCollapsed) {
                                lebarkanSidebarDesktop();
                            } else {
                                kecilkanSidebarDesktop();
                            }
                        }
                    });
                }
            })();
        </script>
    </th:block>
</body>
</html>
