<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SakuKita</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" th:href="@{/css/sakukita.css}">
</head>
<body class="sisi-hijau min-vh-100 d-flex flex-column">

    <nav class="navbar navbar-expand-lg border-bottom border-white border-opacity-10 py-3">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center" th:href="@{/}">
                <img th:src="@{/images/logo.png}" alt="SakuKita" style="height: 38px; width: auto;">
            </a>
            <div class="d-flex align-items-center gap-3">
                <a th:href="@{/login}" class="btn btn-outline-light rounded-pill py-2 px-4 small">Masuk</a>
                <a th:href="@{/register}" class="text-white-50 text-decoration-none small fw-semibold">Daftar</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow-1 d-flex align-items-center py-5">
        <div class="container">
            <div class="row g-5 align-items-center">
                <div class="col-lg-6 pe-lg-4">
                    <h1 class="display-4 font-judul text-white fw-medium mb-3 lh-sm">"Uang lebih terarah, hidup jadi lebih tenang bersama <span class="fst-italic" style="color: var(--warna-mint);">SakuKita</span>"</h1>
                    <p class="text-white-50 fs-6 lh-lg mb-4" style="max-width: 500px;">
                        Biar ngatur duit nggak terasa ribet SakuKita bantu kamu pantau Pemasukan dan ngatur Pengeluaran Jadi, bisa tetap jajan tanpa takut boncos di akhir bulan.
                    </p>
                    <div class="d-flex align-items-center gap-3">
                        <a th:href="@{/register}" class="btn tombol-putih py-2 px-4 shadow d-inline-flex align-items-center gap-2">
                            <span>Mulai Sekarang</span>
                            <i class="bi bi-arrow-right"></i>
                        </a>
                    </div>
                </div>

                <div class="col-lg-6 ps-lg-4 d-flex justify-content-center align-items-center">
                    <img th:src="@{/images/utama.png}" alt="SakuKita Visual" class="img-fluid" style="max-height: 440px; width: auto; filter: drop-shadow(0 20px 45px rgba(0, 0, 0, 0.5));">
                </div>
            </div>
        </div>
    </main>

    <footer class="py-3 text-center text-white-50 small border-top border-white border-opacity-10">
        <div class="container">
            <p class="mb-0">© 2026 SakuKita. Kelola keuangan kamu tanpa drama.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
