<!DOCTYPE html>
<html lang="id" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tambah Pemasukan - SakuKita</title>
    <link rel="icon" type="image/png" th:href="@{/images/logo1.png}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,400&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/assets/vendor/fonts/boxicons.css}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="stylesheet" th:href="@{/css/sakukita.css}" />
</head>

<body>
    <div class="wadah-dashboard-utama">
        <aside th:replace="~{fragments/sidebar :: sidebar('pemasukan')}"></aside>

        <main class="area-konten-dashboard d-flex flex-column">
            <div class="row justify-content-center my-auto w-100 mx-auto">
                <div class="col-12 col-lg-8 col-xl-7 px-0 px-md-3">
                    <div class="card kartu-konten p-4 p-md-5">
                        <div class="d-flex align-items-center gap-3 mb-4 pb-3 border-bottom">
                            <div class="lingkaran-ikon-hijau" style="width: 48px; height: 48px; font-size: 1.5rem;">
                                <i class="bx bx-plus-circle"></i>
                            </div>
                            <div>
                                <h4 class="fw-bold mb-1 text-dark">Catat Pemasukan Baru</h4>
                            </div>
                        </div>

                        <div th:replace="~{fragments/alert :: alert}"></div>

                        <div class="mb-4 p-3 bg-light rounded-3 border"
                            th:if="${templatesPemasukan != null and !#lists.isEmpty(templatesPemasukan)}">
                            <label class="form-label fw-semibold text-dark small mb-1 d-flex align-items-center gap-1">
                                <i class="bx bx-bookmark text-success"></i>
                                <span>Gunakan Template Pemasukan</span>
                            </label>
                            <div class="kotak-input bg-white">
                                <span class="ikon-input"><i class="bx bx-list-check"></i></span>
                                <select class="isi-input form-select border-0 bg-transparent shadow-none"
                                    onchange="if(this.value){window.location.href='/tambahPemasukan?templateId=' + this.value;} else {window.location.href='/tambahPemasukan';}">
                                    <option value="">-- Pilih Template Pemasukan --</option>
                                    <option th:each="tpl : ${templatesPemasukan}" th:value="${tpl.id}"
                                        th:text="${tpl.nama + ' (Rp ' + #numbers.formatDecimal(tpl.jumlah, 0, 'POINT', 0, 'COMMA') + ')'}"
                                        th:selected="${templateDipilih != null and templateDipilih.id == tpl.id}">
                                    </option>
                                </select>
                            </div>
                        </div>

                        <form th:action="@{/pemasukan/tambah}" method="post">
                            <div class="mb-3">
                                <label class="form-label fw-semibold text-dark small mb-1">Jumlah Pemasukan</label>
                                <div class="kotak-input">
                                    <span class="ikon-input fw-bold text-secondary">Rp</span>
                                    <input type="number" name="jumlah" class="isi-input angka-tabel" placeholder="0"
                                        th:value="${templateDipilih != null ? templateDipilih.jumlah : ''}" required>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-semibold text-dark small mb-1">Kategori Pemasukan</label>
                                <div class="kotak-input">
                                    <span class="ikon-input"><i class="bx bx-category"></i></span>
                                    <select name="kategori"
                                        class="isi-input form-select border-0 bg-transparent shadow-none" required>
                                        <option value="Lainnya"
                                            th:selected="${templateDipilih == null or templateDipilih.kategori == null or templateDipilih.kategori.nama == 'Lainnya'}">
                                            Lainnya</option>
                                        <option th:each="k : ${kategori}" th:if="${k.nama != 'Lainnya'}"
                                            th:value="${k.nama}" th:text="${k.nama}"
                                            th:selected="${templateDipilih != null and templateDipilih.kategori != null and templateDipilih.kategori.nama == k.nama}">
                                        </option>
                                    </select>
                                </div>
                            </div>

                            <div class="mb-4">
                                <label class="form-label fw-semibold text-dark small mb-1">Deskripsi</label>
                                <div class="kotak-input">
                                    <span class="ikon-input"><i class="bx bx-notepad"></i></span>
                                    <input type="text" name="keterangan" class="isi-input"
                                        placeholder="Gaji bulanan, Bonus proyek, Penjualan barang"
                                        th:value="${templateDipilih != null ? templateDipilih.keterangan : ''}"
                                        required>
                                </div>
                            </div>

                            <div class="d-flex align-items-center gap-3 pt-2">
                                <button type="submit" class="tombol-utama d-inline-flex align-items-center gap-2">
                                    <span>Tambah</span>
                                </button>
                                <a th:href="@{/pemasukan}"
                                    class="tombol-putih text-decoration-none d-inline-flex align-items-center gap-2">
                                    <span>Batal</span>
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
</body>

</html>
